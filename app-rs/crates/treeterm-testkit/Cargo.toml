[package]
name = "treeterm-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Test support: a real TreeTerm daemon running in-process on a temporary socket, a daemon that fails every call, and a fake ssh host in front of them."

[dependencies]
treeterm-daemon.workspace = true
# The fake ssh host drives the core connection manager's process spawner.
treeterm-core.workspace = true
tokio.workspace = true
tempfile.workspace = true
# `RefusingDaemon`: a gRPC server that fails every call.
tonic.workspace = true
tokio-stream.workspace = true

[dev-dependencies]
treeterm-proto.workspace = true
futures.workspace = true
tempfile.workspace = true
libc.workspace = true

[lints]
workspace = true
