[package]
name = "treeterm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TreeTerm app logic without UI: daemon client, connections, wire formats, pure state machines."

[dependencies]
treeterm-proto.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tower.workspace = true
hyper-util.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
libc.workspace = true
tracing.workspace = true
sha2.workspace = true
base64 = "0.22"
dirs = "6"
hex.workspace = true
indexmap = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
# OpenAI-compatible chat completions (the Electron app used the OpenAI SDK over fetch).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "http2"] }
url = "2"
httpdate = "1"

[dev-dependencies]
# The analyzer tests drive it with the real idle detector, as the GPUI model does.
treeterm-term.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
