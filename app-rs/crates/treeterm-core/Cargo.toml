[package]
name = "treeterm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TreeTerm app logic without UI: daemon client, connections, wire formats, pure state machines."

[dependencies]
treeterm-proto.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tower.workspace = true
hyper-util.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
libc.workspace = true
tracing.workspace = true
sha2.workspace = true
base64 = "0.22"
dirs = "6"
hex.workspace = true
indexmap = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
# HTTP for GitHub REST/GraphQL and OpenAI-compatible chat completions. rustls on ring
# (already in the tree) with the platform verifier, so the system trust store applies, as it
# does for Electron's fetch.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
url = "2"
httpdate = "1"
# Line diffs, for searching a diff the way the viewer lays it out.
similar = "2"

[dev-dependencies]
# The analyzer tests drive it with the real idle detector, as the GPUI model does.
treeterm-term.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
