[package]
name = "treeterm-model"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TreeTerm stores as GPUI entities. Holds all app logic the views render; no widgets."

[dependencies]
treeterm-core.workspace = true
treeterm-term.workspace = true
treeterm-proto.workspace = true
gpui-kit.workspace = true
futures.workspace = true
serde_json.workspace = true
serde.workspace = true
indexmap = "2"
base64 = "0.22"
tracing.workspace = true
thiserror.workspace = true
uuid = { version = "1", features = ["v4"] }
url = "2.5"
# An AI harness's background, any CSS colour as xterm.js reads it (`harness_background`).
# Already built for GPUI's SVG rendering.
svgtypes = "0.16"
# Monaco's per-language word patterns (`words`).
regex = "1"
# Syntax errors of TypeScript and JavaScript files (`code_intel::syntax`): the grammars GPUI
# Kit highlights them with.
tree-sitter = "0.26"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"

[dev-dependencies]
# Electron's localStorage, written for the Recent Directories import tests.
treeterm-core = { workspace = true, features = ["test-support"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
tempfile.workspace = true
# `atexit`, to remove the app_store tests' isolated HOME (a static is never dropped).
libc.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
treeterm-testkit.workspace = true
tokio.workspace = true
serde_json.workspace = true
# The status a `RefusingDaemon` fails every call with.
tonic.workspace = true

[lints]
workspace = true
