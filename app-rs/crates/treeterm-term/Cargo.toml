[package]
name = "treeterm-term"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Terminal emulation core (alacritty_terminal) without any UI: parsing, input encoding, viewport queries."

[dependencies]
alacritty_terminal = "=0.26.0"
# OSC 52 copies are decoded here, as forgivingly as `atob` does in the Electron app.
base64 = "0.22"
regex = "1"
thiserror.workspace = true
tracing.workspace = true
# OSC 8 hyperlinks are links only when they parse as http(s) URLs, as `new URL` reads them.
url = "2"

[lints]
workspace = true
