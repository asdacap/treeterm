<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Sized and coloured as ModelViewer.tsx draws in index.css (.model-viewer-*,
     .file-viewer-placeholder, .file-viewer-error, .file-viewer-toggle-btn). */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1e1e1e; color: #cccccc; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  [hidden] { display: none !important; }
  #canvas { position: absolute; inset: 0; }
  #canvas canvas { display: block; width: 100%; height: 100%; }
  .placeholder { padding: 40px 20px; text-align: center; color: #858585; font-size: 14px; }
  .error { padding: 20px; text-align: center; color: #f14c4c; font-size: 14px; }
  #stage-error { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .spinning { animation: spin 0.6s linear infinite; }
  #toolbar { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
  button { padding: 4px 10px; border: 1px solid #3c3c3c; border-radius: 4px; background: #2d2d2d;
    color: #cccccc; font-family: inherit; font-size: 11px; cursor: pointer;
    transition: background 0.1s, border-color 0.1s; }
  button:hover { background: #3c3c3c; border-color: #0078d4; }
  button.active { background: #094771; border-color: #0078d4; }
  button svg { vertical-align: -2px; }
  #stats, #hint { position: absolute; bottom: 8px; padding: 2px 8px; border-radius: 4px; background: #252526;
    color: #858585; font-size: 11px; pointer-events: none; }
  #stats { left: 8px; }
  #hint { right: 8px; }
  #warning { position: absolute; top: 8px; left: 8px; max-width: 50%; padding: 4px 8px; border: 1px solid #d29922;
    border-radius: 4px; background: #252526; color: #d29922; font-size: 11px; }
</style>
</head>
<body>
<div id="canvas"></div>
<!-- Shown until viewer.js runs, as FileViewer's Suspense fallback while the three.js chunk loads. -->
<div id="loading" class="placeholder">Loading 3D viewer…</div>
<div id="parsing" class="placeholder" hidden><svg class="spinning" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Reading model…</div>
<div id="parse-error" class="error" hidden></div>
<div id="toolbar" hidden>
  <button id="reset" title="Frame the whole model"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg> Reset view</button>
  <button id="wireframe" title="Show the mesh edges" aria-pressed="false"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg> Wireframe</button>
</div>
<div id="stage-error" class="error" hidden></div>
<div id="warning" hidden></div>
<div id="stats" hidden></div>
<div id="hint" hidden>Drag to orbit · Right-drag to pan · Scroll to zoom</div>
<script src="viewer.js"></script>
</body>
</html>
