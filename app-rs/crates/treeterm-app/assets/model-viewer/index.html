<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #1e1e1e; color: #cccccc; overflow: hidden;
    font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #canvas { position: absolute; inset: 0; }
  #canvas canvas { display: block; width: 100%; height: 100%; }
  #status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #858585; }
  #status.error { color: #f48771; padding: 16px; text-align: center; }
  #toolbar { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
  #toolbar[hidden], #warning[hidden] { display: none; }
  button { background: #2d2d2d; color: #cccccc; border: 1px solid #3c3c3c; border-radius: 4px;
    padding: 3px 8px; font: inherit; cursor: pointer; }
  button:hover { background: #37373d; }
  button.active { background: #0e639c; border-color: #0e639c; color: #ffffff; }
  #stats, #hint, #warning { position: absolute; left: 8px; pointer-events: none; }
  #stats { bottom: 26px; }
  #hint { bottom: 8px; color: #858585; }
  #warning { top: 8px; color: #cca700; max-width: 60%; }
</style>
</head>
<body>
<div id="canvas"></div>
<div id="status">Reading model…</div>
<div id="toolbar" hidden><button id="reset" title="Frame the whole model">↺ Reset view</button><button id="wireframe" title="Show the mesh edges">▦ Wireframe</button></div>
<div id="warning" hidden></div>
<div id="stats"></div>
<div id="hint">Drag to orbit · Right-drag to pan · Scroll to zoom</div>
<script src="viewer.js"></script>
</body>
</html>
