[package]
name = "treeterm-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TreeTerm native UI: renders treeterm-model stores with GPUI Kit."

[[bin]]
name = "treeterm"
path = "src/main.rs"

[dependencies]
treeterm-core.workspace = true
indexmap = "2"
dirs = "6"
treeterm-model.workspace = true
treeterm-term.workspace = true
gpui-webview = "=0.9.1"
# The wry fork gpui-webview builds on (same version, so builders are interchangeable).
wry = { package = "lb-wry", version = "=0.53.3" }
gpui-kit = { workspace = true, features = ["component", "assets", "tree-sitter-languages"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
# The types of GPUI Kit's editor hooks (`CompletionProvider`, `DefinitionProvider`); its version.
lsp-types = "0.97.0"
futures = { workspace = true, optional = true }

# The AppKit calls GPUI does not wrap (`macos.rs`). GPUI's `gpui-base` already builds these
# with their default features.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[features]
# Debug-only control socket (TREETERM_AUTOMATION_SOCKET) for e2e tests and screenshots.
automation = ["dep:futures", "gpui-kit/test-support"]

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
# A scripted `ExecApi` for the editor hooks' tests.
futures.workspace = true
# `TestAppContext`, to lay out views in tests.
gpui-kit = { workspace = true, features = ["test-support"] }
# A daemon channel that never connects, for views that only need an `FsClient` to exist.
tonic.workspace = true
