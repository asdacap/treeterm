[package]
name = "treeterm-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TreeTerm native UI: renders treeterm-model stores with GPUI Kit."

[[bin]]
name = "treeterm"
path = "src/main.rs"

[dependencies]
treeterm-core.workspace = true
indexmap = "2"
treeterm-model.workspace = true
treeterm-term.workspace = true
gpui-webview = "=0.9.1"
# The wry fork gpui-webview builds on (same version, so builders are interchangeable).
wry = { package = "lb-wry", version = "=0.53.3" }
gpui-kit = { workspace = true, features = ["component", "assets", "tree-sitter-languages"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
futures = { workspace = true, optional = true }

[features]
# Debug-only control socket (TREETERM_AUTOMATION_SOCKET) for e2e tests and screenshots.
automation = ["dep:futures", "gpui-kit/test-support"]

[lints]
workspace = true
