# Native single-process TreeTerm UI (GPUI). Separate from daemon-rs/ so the daemon's
# lockfile, static musl builds and Nix vendoring never pull in GUI dependencies.
[workspace]
resolver = "2"
members = [
    "crates/treeterm-core",
    "crates/treeterm-term",
    "crates/treeterm-model",
    "crates/treeterm-app",
    "crates/treeterm-testkit",
    "xtask",
]
# Packaging (`cargo run -p xtask -- …`) is not part of a plain `cargo build`.
default-members = [
    "crates/treeterm-core",
    "crates/treeterm-term",
    "crates/treeterm-model",
    "crates/treeterm-app",
    "crates/treeterm-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
treeterm-proto = { path = "../daemon-rs/crates/treeterm-proto" }
treeterm-daemon = { path = "../daemon-rs/crates/treeterm-daemon" }
treeterm-core = { path = "crates/treeterm-core" }
treeterm-term = { path = "crates/treeterm-term" }
treeterm-model = { path = "crates/treeterm-model" }
treeterm-testkit = { path = "crates/treeterm-testkit" }

# GPUI is consumed only through gpui-kit (exact pins: GPUI's API churns). treeterm-model needs
# GPUI without the component layer, so it depends on gpui-kit with default features off.
gpui-kit = { version = "=0.9.1", default-features = false }

tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = "0.7"
tonic = "0.13"
prost = "0.13"
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
let_underscore_must_use = "deny"
let_underscore_future = "deny"

[profile.dev.package."*"]
opt-level = 2
