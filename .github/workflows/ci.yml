name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Run daemon tests with coverage
        run: npm run test:daemon:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage-final.json,./coverage/daemon-lcov.info
          fail_ci_if_error: false

      - name: Build project
        run: npm run build

  native-app:
    # The Rust/GPUI app in app-rs/ (separate Cargo workspace, pinned toolchain).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app-rs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libasound2-dev libssl-dev libzstd-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app-rs/target
          key: app-rs-${{ runner.os }}-${{ hashFiles('app-rs/Cargo.lock', 'app-rs/rust-toolchain.toml') }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --features treeterm-app/automation

      - name: Test
        run: cargo test --workspace

  native-app-bundle:
    # `cargo run -p xtask -- dist`: TreeTerm.app (zipped) on macOS, a tarball on Linux, each
    # with the local daemon and the static musl daemons uploaded to remote Linux hosts.
    # Separate from native-app so the release build gets its own runner disk.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app-rs
    env:
      # No musl cross gcc on the runners: the daemon is pure Rust, so the linker the
      # toolchain ships links the static binaries.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          rustup show active-toolchain || rustup toolchain install
          # The daemons build with daemon-rs's own (default) toolchain, as npm builds them.
          cd ../daemon-rs
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libasound2-dev libssl-dev libzstd-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: app-rs-bundle-${{ runner.os }}-${{ hashFiles('app-rs/Cargo.lock', 'daemon-rs/Cargo.lock') }}

      - name: Build daemons and bundle
        run: cargo run -p xtask -- dist

      - name: Check the bundle carries every daemon
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) daemons=target/dist/TreeTerm.app/Contents/Resources/daemon-rs ;;
            *) daemons=$(echo target/dist/treeterm-*-linux) ;;
          esac
          ls -l "$daemons"
          for daemon in treeterm-daemon treeterm-daemon-x86_64-linux treeterm-daemon-aarch64-linux; do
            test -x "$daemons/$daemon" || { echo "missing $daemons/$daemon"; exit 1; }
          done

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: treeterm-native-${{ runner.os }}
          path: |
            app-rs/target/dist/*.zip
            app-rs/target/dist/*.tar.gz
          if-no-files-found: error

  daemon-container-boot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Boot daemon on ubuntu and fedora
        run: npm run test:daemon:container
